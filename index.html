<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龍與地下城 5E 完整資料庫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.95;
            margin-bottom: 10px;
        }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .stat-badge {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            overflow-x: auto;
        }
        
        .tab {
            padding: 20px 30px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1.1em;
            font-weight: 500;
            color: #495057;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .tab:hover {
            background: #e9ecef;
        }
        
        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        
        .search-container {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }
        
        .search-box {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        
        #searchInput {
            width: 100%;
            padding: 15px 50px 15px 20px;
            font-size: 1.1em;
            border: 2px solid #dee2e6;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s;
        }
        
        #searchInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3em;
        }
        
        .content {
            padding: 30px;
            min-height: 500px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        
        .card-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #2a5298;
        }
        
        .card-subtitle {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 5px;
        }
        
        .card-badge {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            white-space: nowrap;
        }
        
        .card-content {
            color: #495057;
            line-height: 1.6;
        }
        
        .detail-view {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 20px;
        }
        
        .detail-header {
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .detail-title {
            font-size: 2.5em;
            color: #2a5298;
            margin-bottom: 10px;
        }
        
        .detail-subtitle {
            font-size: 1.2em;
            color: #6c757d;
        }
        
        .detail-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.5em;
            color: #2a5298;
            margin-bottom: 15px;
            padding-left: 15px;
            border-left: 4px solid #667eea;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        
        .info-label {
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        
        .info-value {
            color: #667eea;
            font-size: 1.1em;
        }
        
        .description {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.8;
            margin-bottom: 15px;
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .back-button:hover {
            background: #495057;
            transform: translateX(-3px);
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .loading-spinner {
            font-size: 3em;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
            
            .stats-bar {
                gap: 15px;
            }
            
            .stat-badge {
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐉 龍與地下城 5E 完整資料庫</h1>
            <p class="subtitle">包含所有種族、職業、法術、特性的完整資料</p>
            <div class="stats-bar">
                <div class="stat-badge">
                    <div class="stat-number" id="raceCount">-</div>
                    <div class="stat-label">種族</div>
                </div>
                <div class="stat-badge">
                    <div class="stat-number" id="classCount">-</div>
                    <div class="stat-label">職業</div>
                </div>
                <div class="stat-badge">
                    <div class="stat-number" id="spellCount">-</div>
                    <div class="stat-label">法術</div>
                </div>
                <div class="stat-badge">
                    <div class="stat-number" id="featureCount">-</div>
                    <div class="stat-label">特性</div>
                </div>
                <div class="stat-badge">
                    <div class="stat-number" id="traitCount">-</div>
                    <div class="stat-label">種族特質</div>
                </div>
            </div>
        </header>
        
        <div class="tabs">
            <button class="tab active" data-tab="races">🏰 種族 (Races)</button>
            <button class="tab" data-tab="subraces">🎯 亞種 (Subraces)</button>
            <button class="tab" data-tab="classes">⚔️ 職業 (Classes)</button>
            <button class="tab" data-tab="subclasses">🛡️ 子職業 (Subclasses)</button>
            <button class="tab" data-tab="spells">✨ 法術 (Spells)</button>
            <button class="tab" data-tab="features">💪 特性 (Features)</button>
            <button class="tab" data-tab="traits">🌟 種族特質 (Traits)</button>
        </div>
        
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜尋種族、職業、法術、特性...">
                <span class="search-icon">🔍</span>
            </div>
        </div>
        
        <div class="content">
            <div id="listView"></div>
            <div id="detailView" style="display: none;"></div>
        </div>
    </div>
    
    <script>
        let database = null;
        let currentTab = 'races';
        let currentView = 'list';
        
        // Load database
        async function loadDatabase() {
            try {
                const response = await fetch('data/dnd5e_bilingual_database.json');
                database = await response.json();
                updateStats();
                renderList();
            } catch (error) {
                console.error('Error loading database:', error);
                document.getElementById('listView').innerHTML = `
                    <div class="no-results">
                        <h3>⚠️ 無法載入資料庫</h3>
                        <p>請確保 dnd5e_bilingual_database.json 檔案存在於 data/ 目錄中</p>
                    </div>
                `;
            }
        }
        
        // Update statistics
        function updateStats() {
            if (!database) return;
            document.getElementById('raceCount').textContent = database.metadata.total_items.races;
            document.getElementById('classCount').textContent = database.metadata.total_items.classes;
            document.getElementById('spellCount').textContent = database.metadata.total_items.spells;
            document.getElementById('featureCount').textContent = database.metadata.total_items.features;
            document.getElementById('traitCount').textContent = database.metadata.total_items.traits;
        }
        
        // Render list view
        function renderList(filterText = '') {
            const listView = document.getElementById('listView');
            const detailView = document.getElementById('detailView');
            
            listView.style.display = 'block';
            detailView.style.display = 'none';
            
            if (!database) {
                listView.innerHTML = '<div class="loading"><div class="loading-spinner">⏳</div><p>載入中...</p></div>';
                return;
            }
            
            let items = database[currentTab] || [];
            
            // Filter items
            if (filterText) {
                items = items.filter(item => {
                    const nameMatch = item.name.toLowerCase().includes(filterText.toLowerCase());
                    const nameEnMatch = item.index && item.index.toLowerCase().includes(filterText.toLowerCase());
                    const nameZhMatch = item.name_zh && item.name_zh.includes(filterText);
                    return nameMatch || nameEnMatch || nameZhMatch;
                });
            }
            
            if (items.length === 0) {
                listView.innerHTML = '<div class="no-results"><h3>😕 沒有找到結果</h3><p>請嘗試其他搜尋關鍵字</p></div>';
                return;
            }
            
            let html = '<div class="grid">';
            items.forEach(item => {
                const displayName = item.name_zh || item.name;
                const subtitle = item.name_zh ? item.name : '';
                const badge = getBadgeText(item);
                
                html += `
                    <div class="card" onclick="showDetail('${currentTab}', '${item.index || item.name}')">
                        <div class="card-header">
                            <div>
                                <div class="card-title">${displayName}</div>
                                ${subtitle ? `<div class="card-subtitle">${subtitle}</div>` : ''}
                            </div>
                            ${badge ? `<div class="card-badge">${badge}</div>` : ''}
                        </div>
                        <div class="card-content">
                            ${getCardPreview(item)}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            
            listView.innerHTML = html;
        }
        
        // Get badge text for item
        function getBadgeText(item) {
            if (currentTab === 'spells') {
                return item.level === 0 ? '戲法' : `${item.level} 環`;
            } else if (currentTab === 'classes' && item.hit_die) {
                return `d${item.hit_die}`;
            } else if (currentTab === 'features' && item.level) {
                return `Lv ${item.level}`;
            }
            return '';
        }
        
        // Get card preview text
        function getCardPreview(item) {
            if (currentTab === 'spells') {
                const school = item.school_zh || item.school?.name || '';
                const range = item.range || '';
                return `${school} • 範圍: ${range}`;
            } else if (currentTab === 'races' || currentTab === 'subraces') {
                const speed = item.speed || '';
                const size = item.size_zh || item.size || '';
                return `體型: ${size} • 速度: ${speed} 呎`;
            } else if (currentTab === 'classes') {
                const primary = item.primary_ability || '';
                return `主要屬性: ${primary}`;
            } else if (item.desc && item.desc.length > 0) {
                return item.desc[0].substring(0, 100) + '...';
            }
            return '點擊查看詳情';
        }
        
        // Show detail view
        function showDetail(type, id) {
            const listView = document.getElementById('listView');
            const detailView = document.getElementById('detailView');
            
            listView.style.display = 'none';
            detailView.style.display = 'block';
            
            const item = database[type].find(i => i.index === id || i.name === id);
            if (!item) {
                detailView.innerHTML = '<div class="no-results"><h3>找不到項目</h3></div>';
                return;
            }
            
            let html = `
                <button class="back-button" onclick="renderList()">
                    ← 返回列表
                </button>
                <div class="detail-view">
                    <div class="detail-header">
                        <div class="detail-title">${item.name_zh || item.name}</div>
                        <div class="detail-subtitle">${item.name_zh ? item.name : ''}</div>
                    </div>
            `;
            
            // Add type-specific details
            if (type === 'spells') {
                html += renderSpellDetails(item);
            } else if (type === 'races' || type === 'subraces') {
                html += renderRaceDetails(item);
            } else if (type === 'classes') {
                html += renderClassDetails(item);
            } else if (type === 'features' || type === 'traits') {
                html += renderFeatureDetails(item);
            }
            
            html += '</div>';
            detailView.innerHTML = html;
        }
        
        // Render spell details
        function renderSpellDetails(spell) {
            let html = '<div class="info-grid">';
            html += `<div class="info-item"><div class="info-label">等級</div><div class="info-value">${spell.level === 0 ? '戲法' : `${spell.level} 環`}</div></div>`;
            html += `<div class="info-item"><div class="info-label">學派</div><div class="info-value">${spell.school_zh || spell.school?.name || ''}</div></div>`;
            html += `<div class="info-item"><div class="info-label">施法時間</div><div class="info-value">${spell.casting_time || ''}</div></div>`;
            html += `<div class="info-item"><div class="info-label">範圍</div><div class="info-value">${spell.range || ''}</div></div>`;
            html += `<div class="info-item"><div class="info-label">成分</div><div class="info-value">${spell.components?.join(', ') || ''}</div></div>`;
            html += `<div class="info-item"><div class="info-label">持續時間</div><div class="info-value">${spell.duration || ''}</div></div>`;
            html += '</div>';
            
            if (spell.desc && spell.desc.length > 0) {
                html += '<div class="detail-section"><div class="section-title">描述</div>';
                spell.desc.forEach(desc => {
                    html += `<div class="description">${desc}</div>`;
                });
                html += '</div>';
            }
            
            if (spell.classes && spell.classes.length > 0) {
                html += '<div class="detail-section"><div class="section-title">可用職業</div><div class="description">';
                html += spell.classes.map(c => c.name).join(', ');
                html += '</div></div>';
            }
            
            return html;
        }
        
        // Render race details
        function renderRaceDetails(race) {
            let html = '<div class="info-grid">';
            html += `<div class="info-item"><div class="info-label">體型</div><div class="info-value">${race.size_zh || race.size || ''}</div></div>`;
            html += `<div class="info-item"><div class="info-label">速度</div><div class="info-value">${race.speed || ''} 呎</div></div>`;
            
            if (race.age) {
                html += `<div class="info-item"><div class="info-label">壽命</div><div class="info-value">${race.age}</div></div>`;
            }
            
            html += '</div>';
            
            if (race.ability_bonuses && race.ability_bonuses.length > 0) {
                html += '<div class="detail-section"><div class="section-title">屬性加值</div><div class="info-grid">';
                race.ability_bonuses.forEach(bonus => {
                    html += `<div class="info-item"><div class="info-label">${bonus.ability_score.name}</div><div class="info-value">+${bonus.bonus}</div></div>`;
                });
                html += '</div></div>';
            }
            
            if (race.traits && race.traits.length > 0) {
                html += '<div class="detail-section"><div class="section-title">種族特質</div>';
                race.traits.forEach(trait => {
                    html += `<div class="description"><strong>${trait.name}</strong></div>`;
                });
                html += '</div>';
            }
            
            return html;
        }
        
        // Render class details
        function renderClassDetails(cls) {
            let html = '<div class="info-grid">';
            html += `<div class="info-item"><div class="info-label">生命骰</div><div class="info-value">d${cls.hit_die}</div></div>`;
            
            if (cls.saving_throws && cls.saving_throws.length > 0) {
                html += `<div class="info-item"><div class="info-label">擅長豁免</div><div class="info-value">${cls.saving_throws.map(s => s.name).join(', ')}</div></div>`;
            }
            
            html += '</div>';
            
            if (cls.proficiencies && cls.proficiencies.length > 0) {
                html += '<div class="detail-section"><div class="section-title">熟練項目</div><div class="description">';
                html += cls.proficiencies.map(p => p.name).join(', ');
                html += '</div></div>';
            }
            
            if (cls.all_levels && cls.all_levels.length > 0) {
                html += '<div class="detail-section"><div class="section-title">等級進程 (前 3 級)</div>';
                cls.all_levels.slice(0, 3).forEach(level => {
                    html += `<div class="description"><strong>等級 ${level.level}</strong> - 熟練加值: +${level.prof_bonus}`;
                    if (level.features && level.features.length > 0) {
                        html += `<br>特性: ${level.features.map(f => f.name).join(', ')}`;
                    }
                    html += '</div>';
                });
                html += '</div>';
            }
            
            return html;
        }
        
        // Render feature details
        function renderFeatureDetails(feature) {
            let html = '';
            
            if (feature.level || feature.class) {
                html += '<div class="info-grid">';
                if (feature.level) {
                    html += `<div class="info-item"><div class="info-label">等級</div><div class="info-value">${feature.level}</div></div>`;
                }
                if (feature.class) {
                    html += `<div class="info-item"><div class="info-label">職業</div><div class="info-value">${feature.class.name}</div></div>`;
                }
                html += '</div>';
            }
            
            if (feature.desc && feature.desc.length > 0) {
                html += '<div class="detail-section"><div class="section-title">描述</div>';
                feature.desc.forEach(desc => {
                    html += `<div class="description">${desc}</div>`;
                });
                html += '</div>';
            }
            
            return html;
        }
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                renderList();
            });
        });
        
        // Search functionality
        const searchInput = document.getElementById('searchInput');
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                renderList(e.target.value);
            }, 300);
        });
        
        // Initialize
        loadDatabase();
    </script>
</body>
</html>
