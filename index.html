<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5E 完整資料庫 - 繁體中文</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 3px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            background: #e0e0e0;
        }

        .tab.active {
            background: white;
            border-bottom: 3px solid #667eea;
            color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-color: #667eea;
        }

        .card h3 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .card .subtitle {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .card .description {
            color: #333;
            line-height: 1.6;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 800px;
            max-height: 80%;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-content h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .modal-content .section {
            margin-bottom: 25px;
        }

        .modal-content h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .modal-content p {
            line-height: 1.8;
            color: #333;
            margin-bottom: 10px;
        }

        .modal-content ul {
            margin-left: 20px;
            line-height: 1.8;
        }

        .modal-content li {
            margin-bottom: 8px;
        }

        .subrace {
            margin-left: 20px;
            padding-left: 15px;
            border-left: 3px solid #667eea;
            margin-top: 10px;
        }

        .subrace h4 {
            color: #2a5298;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>D&D 5E 完整資料庫 - 繁體中文</h1>
            <p>選擇下方標籤，探索你的角色自定義選項</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('classes')">職業</div>
            <div class="tab" onclick="switchTab('races')">種族</div>
        </div>

        <div class="content">
            <div id="classes" class="tab-content active">
                <div id="classGrid" class="grid"></div>
            </div>

            <div id="races" class="tab-content">
                <div id="raceGrid" class="grid"></div>
            </div>
        </div>
    </div>

    <!-- Modal for detailed information -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        let classesData = [];
        let racesData = [];

        // Switch between tabs
        function switchTab(tabName) {
            // Remove active class from all tabs and content
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            // Add active class to selected tab and content
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        // Load classes data
        fetch('data/dnd5e_classes_complete_tc.json')
            .then(response => response.json())
            .then(data => {
                classesData = data.classes;
                displayClasses();
            })
            .catch(error => console.error('Error loading classes:', error));

        // Load races data
        fetch('data/dnd5e_races_complete_tc.json')
            .then(response => response.json())
            .then(data => {
                racesData = data.races;
                displayRaces();
            })
            .catch(error => console.error('Error loading races:', error));

        // Display classes
        function displayClasses() {
            const grid = document.getElementById('classGrid');
            grid.innerHTML = '';

            classesData.forEach(classItem => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showClassDetails(classItem);
                card.innerHTML = `
                    <h3>${classItem.name}</h3>
                    <div class="subtitle">${classItem.english_name}</div>
                    <div class="description">${classItem.description.substring(0, 100)}...</div>
                `;
                grid.appendChild(card);
            });
        }

        // Display races
        function displayRaces() {
            const grid = document.getElementById('raceGrid');
            grid.innerHTML = '';

            racesData.forEach(race => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showRaceDetails(race);
                card.innerHTML = `
                    <h3>${race.name}</h3>
                    <div class="subtitle">${race.english_name}</div>
                    <div class="description">${race.description.substring(0, 100)}...</div>
                `;
                grid.appendChild(card);
            });
        }

        // Show class details in modal
        function showClassDetails(classItem) {
            const modalContent = document.getElementById('modalContent');
            
            let html = `
                <h2>${classItem.name} (${classItem.english_name})</h2>
                <div class="section">
                    <h3>簡介</h3>
                    <p>${classItem.description}</p>
                </div>
                <div class="section">
                    <h3>基本資訊</h3>
                    <p>命中骰：${classItem.hit_die}</p>
                    <p>主要屬性：${classItem.primary_ability}</p>
                    <p>豁免投擲值精通：${classItem.save_throw_proficiencies}</p>
                    <p>護甲精通：${classItem.armor_proficiencies}</p>
                    <p>武器精通：${classItem.weapon_proficiencies}</p>
                </div>
            `;

            if (classItem.features && classItem.features.length > 0) {
                html += `
                    <div class="section">
                        <h3>職業特性</h3>
                        <ul>
                `;
                classItem.features.forEach(feature => {
                    html += `<li><strong>${feature.name} (LV.${feature.level})</strong>: ${feature.description}</li>`;
                });
                html += `
                        </ul>
                    </div>
                `;
            }

            modalContent.innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        // Show race details in modal
        function showRaceDetails(race) {
            const modalContent = document.getElementById('modalContent');
            
            let html = `
                <h2>${race.name} (${race.english_name})</h2>
                <div class="section">
                    <h3>簡介</h3>
                    <p>${race.description}</p>
                </div>
                <div class="section">
                    <h3>基本屬性</h3>
                    <p>體型：${race.size}</p>
                    <p>速度：${race.speed}</p>
                    <p>屬性值調整：${race.ability_score_increase}</p>
                    <p>語言：${race.languages}</p>
                </div>
            `;

            if (race.traits && race.traits.length > 0) {
                html += `
                    <div class="section">
                        <h3>種族特性</h3>
                        <ul>
                `;
                race.traits.forEach(trait => {
                    html += `<li><strong>${trait.name}</strong>: ${trait.description}</li>`;
                });
                html += `
                        </ul>
                    </div>
                `;
            }

            if (race.subraces && race.subraces.length > 0) {
                html += `<div class="section"><h3>子種族</h3>`;
                race.subraces.forEach(subrace => {
                    html += `<div class="subrace">`;
                    html += `<h4>${subrace.name} (${subrace.english_name})</h4>`;
                    html += `<p>${subrace.description}</p>`;
                    if (subrace.traits && subrace.traits.length > 0) {
                        html += `<ul>`;
                        subrace.traits.forEach(trait => {
                            html += `<li><strong>${trait.name}</strong>: ${trait.description}</li>`;
                        });
                        html += `</ul>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
            }

            modalContent.innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Close modal on outside click
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
