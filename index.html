<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .search-container {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }
        
        .search-box {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }
        
        #searchInput {
            width: 100%;
            padding: 15px 50px 15px 20px;
            font-size: 1.1em;
            border: 2px solid #dee2e6;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s;
        }
        
        #searchInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3em;
            color: #6c757d;
        }
        
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #dee2e6;
            border-top: none;
            border-radius: 0 0 15px 15px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f1f3f5;
        }
        
        .suggestion-item:hover {
            background: #f8f9fa;
        }
        
        .suggestion-item:last-child {
            border-bottom: none;
        }
        
        .main-content {
            display: flex;
            min-height: 600px;
        }
        
        .sidebar {
            width: 350px;
            background: #f8f9fa;
            padding: 30px 20px;
            border-right: 2px solid #e9ecef;
            overflow-y: auto;
            max-height: calc(100vh - 300px);
        }
        
        .filter-section {
            margin-bottom: 30px;
        }
        
        .filter-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2a5298;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .filter-item {
            padding: 10px;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-size: 0.95em;
        }
        
        .filter-item:hover {
            border-color: #667eea;
            background: #f0f3ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        
        .filter-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            max-height: calc(100vh - 300px);
        }
        
        .welcome-message {
            text-align: center;
            color: #6c757d;
            padding: 100px 20px;
        }
        
        .welcome-message h2 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #495057;
        }
        
        .abilities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .ability-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .ability-card:hover {
            border-color: #667eea;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transform: translateY(-3px);
        }
        
        .ability-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2a5298;
        }
        
        .ability-type {
            display: inline-block;
            padding: 5px 12px;
            background: #e7f5ff;
            color: #1971c2;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }
        
        .ability-summary {
            color: #6c757d;
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .detail-view {
            display: none;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .detail-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }
        
        .detail-title {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .detail-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.95em;
            opacity: 0.9;
        }
        
        .meta-item {
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 20px;
        }
        
        .detail-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2a5298;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-content {
            color: #495057;
            line-height: 1.8;
            font-size: 1.05em;
        }
        
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }
        
        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .stat-label {
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
        }
        
        .stat-value {
            color: #667eea;
            font-size: 1.1em;
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .back-button:hover {
            background: #495057;
            transform: translateX(-3px);
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .no-results h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        
        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                max-height: none;
                border-right: none;
                border-bottom: 2px solid #e9ecef;
            }
            
            .abilities-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .filter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

                </div>
                
                <div id="detailView" class="detail-view"></div>
            </main>
        </div>
    </div>

                            effect: '附贈動作可以執行：衝刺、脫離或躲藏',
                            duration: '本回合',
                            range: '自身',
                            materials: '無',
                            stats: {
                                actionType: '附贈動作',
                                options: '衝刺/脫離/躲藏'
                            }
                        },
                        {
                            id: 'rogue_evasion',
                            name: '閃避',
                            type: '職業特性（7 級）',
                            summary: '成功豁免時不受傷害，失敗時只受一半傷害',
                            description: '你能夠靈巧地避開某些區域效果。當你受到需要進行敏捷豁免的效果時，成功則不受傷害，失敗也只受一半傷害。',
                            usage: '被動特性，對需要敏捷豁免的效果生效',
                            effect: '豁免成功：無傷害；豁免失敗：一半傷害',
                            duration: '永久',
                            range: '自身',
                            materials: '無',
                            stats: {
                                level: '7',
                                saveType: '敏捷豁免'
                            }
                        }
                    ]
                },
                {
                    id: 'cleric',
                    name: '牧師',
                    nameEn: 'Cleric',
                    abilities: [
                        {
                            id: 'cleric_channel_divinity',
                            name: '引導神力',
                            type: '職業特性',
                            summary: '引導神聖能量產生特殊效果',
                            description: '你可以直接引導來自神祇的神聖能量，使用該能量來產生魔法效果。',
                            usage: '短休或長休後恢復，2 級時每次休息 1 次使用',
                            effect: '效果取決於神域選擇。常見效果包括：驅散不死生物、增強盟友等',
                            duration: '依效果',
                            range: '依效果',
                            materials: '聖徽',
                            stats: {
                                uses: '1 次/短休（6 級：2 次，18 級：3 次）',
                                recharge: '短休或長休'
                            }
                        },
                        {
                            id: 'cleric_divine_intervention',
                            name: '神聖介入',
                            type: '職業特性（10 級）',
                            summary: '請求神祇直接介入',
                            description: '你可以呼喚你的神祇介入幫助你。描述你需要的幫助，擲 d100。如果擲出的數字等於或小於你的牧師等級，你的神祇介入。',
                            usage: '7 天冷卻時間',
                            effect: 'DM 選擇介入的性質；效果可能是任何牧師法術或牧師神域法術的效果',
                            duration: '依效果',
                            range: '依效果',
                            materials: '無',
                            stats: {
                                level: '10',
                                successRate: '等於或小於牧師等級%',
                                cooldown: '7 天（成功時）',
                                level20: '20 級時自動成功'
                            }
                        }
                    ]
                }
            ]
        };
        
        // 狀態管理
        let currentView = 'welcome';
        let currentFilter = null;
        let searchTerm = '';
        
        // 初始化
        function init() {
            renderFilters();
            setupEventListeners();
        }
        
        // 渲染過濾器
        function renderFilters() {
            const raceFilters = document.getElementById('raceFilters');
            const classFilters = document.getElementById('classFilters');
            
            database.races.forEach(race => {
                const div = document.createElement('div');
                div.className = 'filter-item';
                div.textContent = race.name;
                div.onclick = () => selectFilter('race', race.id);
                raceFilters.appendChild(div);
            });
            
            database.classes.forEach(cls => {
                const div = document.createElement('div');
                div.className = 'filter-item';
                div.textContent = cls.name;
                div.onclick = () => selectFilter('class', cls.id);
                classFilters.appendChild(div);
            });
        }
        
        // 選擇過濾器
        function selectFilter(type, id) {
            // 移除所有 active 類別
            document.querySelectorAll('.filter-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // 添加 active 到選中的項目
            event.target.classList.add('active');
            
            currentFilter = { type, id };
            showList();
        }
        
        // 顯示列表視圖
        function showList() {
            hideAllViews();
            document.getElementById('listView').style.display = 'block';
            
            let items, title;
            
            if (currentFilter.type === 'race') {
                const race = database.races.find(r => r.id === currentFilter.id);
                items = race.abilities;
                title = `${race.name} (${race.nameEn}) - 種族能力`;
            } else {
                const cls = database.classes.find(c => c.id === currentFilter.id);
                items = cls.abilities;
                title = `${cls.name} (${cls.nameEn}) - 職業能力`;
            }
            
            document.getElementById('listTitle').textContent = title;
            renderAbilitiesList(items);
        }
        
        // 渲染能力列表
        function renderAbilitiesList(abilities) {
            const container = document.getElementById('abilitiesList');
            container.innerHTML = '';
            
            if (abilities.length === 0) {
                container.innerHTML = '<div class="no-results"><h3>沒有找到相關能力</h3></div>';
                return;
            }
            
            abilities.forEach(ability => {
                const card = document.createElement('div');
                card.className = 'ability-card';
                card.onclick = () => showDetail(ability);
                
                card.innerHTML = `
                    <div class="ability-name">${ability.name}</div>
                    <span class="ability-type">${ability.type}</span>
                    <div class="ability-summary">${ability.summary}</div>
                `;
                
                container.appendChild(card);
            });
        }
        
        // 顯示詳細視圖
        function showDetail(ability) {
            hideAllViews();
            const detailView = document.getElementById('detailView');
            detailView.style.display = 'block';
            
            let statsHtml = '';
            if (ability.stats) {
                statsHtml = '<div class="detail-section"><div class="section-title">📊 數據統計</div><div class="stat-grid">';
                for (const [key, value] of Object.entries(ability.stats)) {
                    const label = formatStatLabel(key);
                    statsHtml += `
                        <div class="stat-item">
                            <div class="stat-label">${label}</div>
                            <div class="stat-value">${value}</div>
                        </div>
                    `;
                }
                statsHtml += '</div></div>';
            }
            
            detailView.innerHTML = `
                <button class="back-button" onclick="goBack()">← 返回</button>
                
                <div class="detail-header">
                    <div class="detail-title">${ability.name}</div>
                    <div class="detail-meta">
                        <span class="meta-item">${ability.type}</span>
                    </div>
                </div>
                
                <div class="detail-section">
                    <div class="section-title">📖 描述</div>
                    <div class="section-content">${ability.description}</div>
                </div>
                
                <div class="detail-section">
                    <div class="section-title">🎯 使用方式</div>
                    <div class="section-content">${ability.usage}</div>
                </div>
                
                <div class="detail-section">
                    <div class="section-title">✨ 效果</div>
                    <div class="section-content">${ability.effect}</div>
                </div>
                
                <div class="detail-section">
                    <div class="section-title">⏱️ 持續時間</div>
                    <div class="section-content">${ability.duration}</div>
                </div>
                
                <div class="detail-section">
                    <div class="section-title">📏 範圍</div>
                    <div class="section-content">${ability.range}</div>
                </div>
                
                <div class="detail-section">
                    <div class="section-title">🎒 所需材料</div>
                    <div class="section-content">${ability.materials}</div>
                </div>
                
                ${statsHtml}
            `;
        }
        
        // 格式化統計標籤
        function formatStatLabel(key) {
            const labels = {
                actionType: '動作類型',
                recharge: '恢復方式',
                uses: '使用次數',
                damage: '傷害',
                condition: '觸發條件',
                level: '需要等級',
                saveType: '豁免類型',
                successRate: '成功率',
                cooldown: '冷卻時間',
                limitation: '限制',
                spells: '法術數量',
                options: '可選項',
                level5: '5 級',
                level11: '11 級',
                level20: '20 級'
            };
            return labels[key] || key;
        }
        
        // 返回按鈕
        function goBack() {
            if (currentFilter) {
                showList();
            } else {
                showWelcome();
            }
        }
        
        // 顯示歡迎畫面
        function showWelcome() {
            hideAllViews();
            document.getElementById('welcomeView').style.display = 'block';
            document.querySelectorAll('.filter-item').forEach(item => {
                item.classList.remove('active');
            });
            currentFilter = null;
        }
        
        // 隱藏所有視圖
        function hideAllViews() {
            document.getElementById('welcomeView').style.display = 'none';
            document.getElementById('listView').style.display = 'none';
            document.getElementById('detailView').style.display = 'none';
        }
        
        // 搜尋功能
        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            const suggestions = document.getElementById('suggestions');
            
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                
                if (query.length === 0) {
                    suggestions.style.display = 'none';
                    return;
                }
                
                const results = searchAbilities(query);
                showSuggestions(results);
            });
            
            searchInput.addEventListener('blur', () => {
                setTimeout(() => {
                    suggestions.style.display = 'none';
                }, 200);
            });
        }
        
        // 搜尋能力
        function searchAbilities(query) {
            const results = [];
            
            database.races.forEach(race => {
                race.abilities.forEach(ability => {
                    if (matchesQuery(ability, query)) {
                        results.push({ ...ability, category: `${race.name} - 種族` });
                    }
                });
            });
            
            database.classes.forEach(cls => {
                cls.abilities.forEach(ability => {
                    if (matchesQuery(ability, query)) {
                        results.push({ ...ability, category: `${cls.name} - 職業` });
                    }
                });
            });
            
            return results;
        }
        
        // 匹配查詢
        function matchesQuery(ability, query) {
            return ability.name.toLowerCase().includes(query) ||
                   ability.type.toLowerCase().includes(query) ||
                   ability.summary.toLowerCase().includes(query) ||
                   ability.description.toLowerCase().includes(query);
        }
        
        // 顯示建議
        function showSuggestions(results) {
            const suggestions = document.getElementById('suggestions');
            suggestions.innerHTML = '';
            
            if (results.length === 0) {
                suggestions.innerHTML = '<div class="suggestion-item">沒有找到相關結果</div>';
                suggestions.style.display = 'block';
                return;
            }
            
            results.slice(0, 10).forEach(result => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `
                    <strong>${result.name}</strong><br>
                    <small style="color: #6c757d;">${result.category} - ${result.summary}</small>
                `;
                div.onclick = () => {
                    showDetail(result);
                    document.getElementById('searchInput').value = '';
                };
                suggestions.appendChild(div);
            });
            
            suggestions.style.display = 'block';
        }
        
        // 啟動應用
        init();
    </script>
</body>
</html>
