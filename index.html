<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5E 完整資料庫 - 繁體中文</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 3px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            background: #e0e0e0;
        }

        .tab.active {
            background: white;
            border-bottom: 3px solid #667eea;
            color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-color: #667eea;
        }

        .card h3 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .card .subtitle {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            margin: 3px;
            background: #e0e7ff;
            color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            margin: 50px auto;
            max-width: 800px;
            border-radius: 15px;
            padding: 30px;
            position: relative;
            animation: modalFadeIn 0.3s;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2.5em;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .modal .category-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
        }

        .modal .category-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #e0e7ff;
            padding-bottom: 10px;
        }

        .modal .category-section p {
            line-height: 1.8;
            margin-bottom: 10px;
            color: #333;
        }

        .subclass-container {
            margin-top: 15px;
            padding: 15px;
            background: #ffffff;
            border-radius: 8px;
            border: 2px solid #e0e7ff;
        }

        .subclass-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .subclass-header:hover {
            background: #e0e7ff;
        }

        .subclass-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 20px;
        }

        .subclass-details.expanded {
            max-height: 1000px;
            padding: 20px 20px;
            transition: max-height 0.5s ease-in;
        }

        .toggle-icon {
            transition: transform 0.3s;
        }

        .toggle-icon.expanded {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>D&D 5E 完整資料庫 - 繁體中文</h1>
            <p>化身英雄、宏偉冒險旅手建陣，開始你的史詩生涯</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('classes')">職業（Classes）</div>
            <div class="tab" onclick="switchTab('races')">種族（Races）</div>
        </div>

        <div class="content">
            <div id="classes" class="tab-content active">
                <div class="grid" id="classesGrid"></div>
            </div>

            <div id="races" class="tab-content">
                <div class="grid" id="racesGrid"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        let classesData = {};
        let racesData = {};

        // Load classes data
        fetch('data/dnd5e_classes_complete_tc.json')
            .then(response => response.json())
            .then(data => {
                classesData = data;
                renderClasses();
            })
            .catch(error => console.error('加載職業資料', error));

        // Load races data
        fetch('data/dnd5e_races_complete_tc.json')
            .then(response => response.json())
            .then(data => {
                racesData = data;
                renderRaces();
            })
            .catch(error => console.error('加載種族資料', error));

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        function renderClasses() {
            const grid = document.getElementById('classesGrid');
            grid.innerHTML = '';
            Object.entries(classesData).forEach(([key, classData]) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showClassDetail(key);
                
                const badges = [
                    `生命值: ${classData.hit_die}`,
                    `主屬性數正值: ${classData.primary_ability}`
                ].map(b => `<span class="badge">${b}</span>`).join('');

                card.innerHTML = `
                    <h3>${classData.name}</h3>
                    <div class="subtitle">${classData.description.substring(0, 100)}...</div>
                    ${badges}
                `;
                grid.appendChild(card);
            });
        }

        function renderRaces() {
            const grid = document.getElementById('racesGrid');
            grid.innerHTML = '';
            Object.entries(racesData).forEach(([key, raceData]) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showRaceDetail(key);
                
                const badges = [
                    `主屏格: ${raceData.main_trait}`
                ].map(b => `<span class="badge">${b}</span>`).join('');

                card.innerHTML = `
                    <h3>${raceData.name}</h3>
                    <div class="subtitle">${raceData.description.substring(0, 100)}...</div>
                    ${badges}
                `;
                grid.appendChild(card);
            });
        }

        function showClassDetail(classKey) {
            const classData = classesData[classKey];
            const modalContent = document.getElementById('modalContent');

            // Build subclassesHTML
            let subclassesHTML = '';
            if (classData.subclasses) {
                subclassesHTML = '<div class="category-section"><h3>專屬自趣（Subclasses）</h3>';
                Object.entries(classData.subclasses).forEach(([subkey, sub]) => {
                    subclassesHTML += `
					<div class="subclass-container">
						<div class="subclass-header" onclick="event.stopPropagation(); this.classList.toggle('expanded')">
							<span>${sub.name}</span>
							<span class="toggle-icon">▼</span>
						</div>
						<div id="subclass-${subkey}" class="subclass-details">
							<p>${sub.description}</p>
						</div>
					</div>
				` ;
                });
                subclassesHTML += '</div>';
            }

            modalContent.innerHTML = `
                <h2>${classData.name}</h2>
                <div class="category-section">
                    <h3>簡介</h3>
                    <p>${classData.description}</p>
                </div>
                <div class="category-section">
                    <h3>基本能力</h3>
                    <p>命中值: ${classData.hit_die}</p>
                    <p>主屬性數正值: ${classData.primary_ability}</p>
                    <p>豁免能證(豁豁)、偏蝕： ${classData.saving_throw_proficiencies}</p>
                </div>
                ${subclassesHTML}
                <div class="category-section">
                    <h3>裝備能力</h3>
                    <p>${classData.equipment_proficiencies}</p>
                </div>
                <div class="category-section">
                    <h3>職業特效</h3>
                    ${Object.entries(classData.class_features).map(([level, features]) => `
                        <p><strong>等圈、${level}:</strong> ${features}</p>
                    `).join('')}
                </div>
            `;
            document.getElementById('modal').style.display = 'block';
        }

        function showRaceDetail(raceKey) {
            const raceData = racesData[raceKey];
            const modalContent = document.getElementById('modalContent');

            // Build subracesHTML
            let subracesHTML = '';
            if (raceData.subraces) {
                subracesHTML = '<div class="category-section"><h3>一級變型</h3>';
                Object.entries(raceData.subraces).forEach(([subkey, sub]) => {
                    subracesHTML += `
					<div class="subclass-container">
						<div class="subclass-header" onclick="event.stopPropagation(); this.classList.toggle('expanded')">
							<span>${sub.name}</span>
							<span class="toggle-icon">▼</span>
						</div>
						<div id="subclass-${subkey}" class="subclass-details">
							<p>${sub.description}</p>
						</div>
					</div>
				` ;
                });
                subracesHTML += '</div>';
            }

            modalContent.innerHTML = `
                <h2>${raceData.name}</h2>
                <div class="category-section">
                    <h3>簡介</h3>
                    <p>${raceData.description}</p>
                </div>
                ${subracesHTML}
                <div class="category-section">
                    <h3>大級表該</h3>
                    <p>單長調預： ${raceData.size}</p>
                    <p>移動速度: ${raceData.speed}</p>
                </div>
                <div class="category-section">
                    <h3>能力數據</h3>
                    <p>${raceData.ability_bonus} </p>
                </div>
                <div class="category-section">
                    <h3>種族特效</h3>
                    ${Object.entries(raceData.traits).map(([traitName, traitDesc]) => `
                        <p><strong>${traitName}:</strong> ${traitDesc}</p>
                    `).join('')}
                </div>
            `;
            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function toggleSubclass(subkey, event) {
            event.stopPropagation();
            const details = document.getElementById(`subclass-${subkey}`);
            const icon = event.currentTarget.querySelector('.toggle-icon');
            details.classList.toggle('expanded');
            icon.classList.toggle('expanded');
        }
    </script>
</body>
</html>
