<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5E 完整資料庫 - 繁體中文</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --primary-color: #4a69bd;
            --header-bg: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --bg-gradient: linear-gradient(180deg, #5a77e6 0%, #8e54e9 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .main-container {
            width: 100%; max-width: 600px;
            background: white; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden; min-height: 400px;
        }
        .header { background: var(--header-bg); color: white; padding: 30px 20px; text-align: center; }
        .header-icon { font-size: 3em; margin-bottom: 10px; display: block; }
        .menu-btn {
            width: 100%; padding: 25px; background: white; border: none;
            border-bottom: 2px solid #f0f0f0; color: var(--primary-color);
            font-size: 1.3em; font-weight: bold; cursor: pointer; text-align: center;
        }
        .menu-btn:hover { background: #f0f5ff; }
        #content-view { display: none; padding: 20px; background: #f9f9f9; }
        .controls-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .search-input, .filter-select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .filter-select { display: none; background: white; }
        .grid { display: grid; gap: 15px; grid-template-columns: 1fr; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); } }
        .card {
            background: white; border-radius: 12px; padding: 20px;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-3px); border: 1px solid var(--primary-color); }
        .card h3 { color: #2a4a8b; margin-bottom: 5px; }
        .card .subtitle { color: #888; font-size: 0.9em; margin-bottom: 10px; }
        
        /* Modal Styles */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1000;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; padding: 30px; border-radius: 15px;
            width: 100%; max-width: 800px; max-height: 85vh; overflow-y: auto;
            position: relative;
        }
        .close { position: absolute; top: 15px; right: 20px; font-size: 2em; cursor: pointer; }
        
        /* Sub-items in Modal */
        .sub-section { background: #f0f5ff; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .sub-section h4 { color: #1e3c72; margin-bottom: 8px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        .sub-item { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #ddd; }
        .sub-item:last-child { border-bottom: none; }
        .tag { display: inline-block; background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <span class="header-icon">🐉</span>
            <h1>D&D 5E 資料庫</h1>
            <p>SRD 5.1 繁體中文版</p>
        </div>

        <div id="loading" style="text-align:center; padding:40px;">載入中...</div>

        <div id="landing-view" style="display: none;">
            <button class="menu-btn" onclick="navigateTo('races')">種族 (Races)</button>
            <button class="menu-btn" onclick="navigateTo('classes')">職業 (Classes)</button>
            <button class="menu-btn" onclick="navigateTo('spells')">法術 (Spells)</button>
        </div>

        <div id="content-view">
            <button onclick="showLanding()" style="margin-bottom:10px; padding:5px 10px; cursor:pointer;">← 返回</button>
            <h2 id="section-title" style="text-align:center; margin-bottom:15px; color:#4a69bd;"></h2>
            
            <div class="controls-area">
                <input type="text" id="searchInput" class="search-input" placeholder="搜尋名稱...">
                <select id="spellClassFilter" class="filter-select"><option value="">所有職業</option></select>
            </div>
            <div id="content-grid" class="grid"></div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        let db = { classes: {}, races: {}, spells: {} };
        let currentSection = null;

        async function loadData() {
            try {
                // 假設檔案位於 data/ 資料夾
                const [c, r, s] = await Promise.all([
                    fetch('data/dnd5e_classes_complete_tc.json').then(res => res.json()),
                    fetch('data/dnd5e_races_complete_tc.json').then(res => res.json()),
                    fetch('data/dnd5e_spells_complete_tc.json').then(res => res.json())
                ]);
                db.classes = c; db.races = r; db.spells = s;
                
                // 提取法術職業以供過濾
                let spellClasses = new Set();
                Object.values(db.spells).forEach(sp => sp.classes?.forEach(c => spellClasses.add(c)));
                const sel = document.getElementById('spellClassFilter');
                Array.from(spellClasses).sort().forEach(sc => {
                    let opt = document.createElement('option');
                    opt.value = sc; opt.textContent = sc;
                    sel.appendChild(opt);
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('landing-view').style.display = 'block';
            } catch (e) {
                document.getElementById('loading').innerHTML = '載入失敗，請確認 JSON 檔案存在且格式正確。';
                console.error(e);
            }
        }

        function navigateTo(sec) {
            currentSection = sec;
            document.getElementById('landing-view').style.display = 'none';
            document.getElementById('content-view').style.display = 'block';
            document.getElementById('section-title').textContent = 
                sec === 'races' ? '種族列表' : sec === 'classes' ? '職業列表' : '法術列表';
            document.getElementById('spellClassFilter').style.display = sec === 'spells' ? 'block' : 'none';
            render();
        }

        function showLanding() {
            document.getElementById('content-view').style.display = 'none';
            document.getElementById('landing-view').style.display = 'block';
        }

        function render() {
            const grid = document.getElementById('content-grid');
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('spellClassFilter').value;
            grid.innerHTML = '';

            const data = db[currentSection];
            if (!data) return;

            Object.entries(data).forEach(([key, item]) => {
                const name = (item.name || key).toLowerCase();
                const en = (item.name_en || '').toLowerCase();
                if (!name.includes(term) && !en.includes(term)) return;
                
                if (currentSection === 'spells' && filter) {
                    if (!item.classes || !item.classes.includes(filter)) return;
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h3>${item.name || key}</h3><div class="subtitle">${item.name_en || ''}</div>`;
                
                // 根據類型顯示簡短資訊
                if (currentSection === 'races') card.innerHTML += `<div style="font-size:0.9em; color:#666;">${item.speed}呎 | ${item.size}</div>`;
                if (currentSection === 'classes') card.innerHTML += `<div style="font-size:0.9em; color:#666;">HD: ${item.hit_die}</div>`;
                if (currentSection === 'spells') card.innerHTML += `<div style="font-size:0.9em; color:#666;">${item.level === 0 ? '戲法' : item.level+'環'} | ${item.school}</div>`;

                card.onclick = () => showDetail(item);
                grid.appendChild(card);
            });
        }

        function showDetail(item) {
            const modalBody = document.getElementById('modal-body');
            let html = `<h2>${item.name} <small style="font-size:0.6em; color:#666;">${item.name_en || ''}</small></h2><hr><br>`;
            
            html += `<p>${item.description || '無描述'}</p><br>`;

            // --- 處理職業 (Classes) 與其子職業 ---
            if (currentSection === 'classes') {
                html += `<p><strong>生命骰:</strong> ${item.hit_die}</p>`;
                html += `<p><strong>專精武器:</strong> ${(item.weapon_proficiency||[]).join(', ')}</p>`;
                
                // 顯示子職業
                if (item.subclasses) {
                    html += `<div class="sub-section"><h4>子職業 (Subclasses)</h4>`;
                    Object.values(item.subclasses).forEach(sub => {
                        html += `<div class="sub-item">
                            <strong>${sub.name} (${sub.name_en})</strong>
                            <p style="font-size:0.9em; margin-top:5px;">${sub.description}</p>
                        </div>`;
                    });
                    html += `</div>`;
                }
            }

            // --- 處理種族 (Races) 與其子種族 ---
            else if (currentSection === 'races') {
                html += `<p><strong>速度:</strong> ${item.speed} 呎</p><p><strong>體型:</strong> ${item.size}</p>`;
                
                // 顯示特質
                if (item.traits) {
                    html += `<br><strong>種族特質:</strong><ul style="padding-left:20px; margin-top:5px;">`;
                    Object.values(item.traits).forEach(t => {
                        html += `<li><span class="tag">${t.name}</span> ${t.description}</li>`;
                    });
                    html += `</ul>`;
                }

                // 顯示子種族
                if (item.subraces && Object.keys(item.subraces).length > 0) {
                    html += `<div class="sub-section"><h4>亞種/子種族 (Subraces)</h4>`;
                    Object.values(item.subraces).forEach(sub => {
                        html += `<div class="sub-item">
                            <strong>${sub.name} (${sub.name_en})</strong>
                            <p style="font-size:0.9em; margin-top:5px;">${sub.description}</p>
                            ${sub.traits ? `<div style="margin-top:5px; font-size:0.85em; color:#555;">特質: ` + Object.values(sub.traits).map(t=>t.name).join(', ') + `</div>` : ''}
                        </div>`;
                    });
                    html += `</div>`;
                }
            }

            // --- 處理法術 (Spells) ---
            else if (currentSection === 'spells') {
                const lv = item.level === 0 || item.level === "0" ? '戲法' : `${item.level}環`;
                html += `<p><strong>${lv} ${item.school}系</strong></p>`;
                html += `<p><strong>施法時間:</strong> ${item.casting_time}</p>`;
                html += `<p><strong>射程:</strong> ${item.range}</p>`;
                html += `<p><strong>成分:</strong> ${item.components}</p>`;
                html += `<p><strong>持續:</strong> ${item.duration}</p>`;
                if (item.classes) html += `<br><p><small>可用職業: ${item.classes.join(', ')}</small></p>`;
            }

            modalBody.innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        document.getElementById('searchInput').addEventListener('input', () => setTimeout(render, 300));
        document.getElementById('spellClassFilter').addEventListener('change', render);

        loadData();
    </script>
</body>
</html>
