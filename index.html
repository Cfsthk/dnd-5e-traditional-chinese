<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5E 完整資料庫 - 繁體中文</title>
    <style>
        :root {
            --primary-color: #4a69bd;
            --header-bg: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --bg-gradient: linear-gradient(180deg, #5a77e6 0%, #8e54e9 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Main Container holding everything */
        .main-container {
            width: 100%;
            max-width: 600px; /* Limits width for mobile look on desktop */
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            min-height: 400px;
            position: relative;
        }

        /* --- Header Section --- */
        .header {
            background: var(--header-bg);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header-icon {
            font-size: 3em;
            margin-bottom: 10px;
            display: block;
        }

        .header h1 {
            font-size: 1.8em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .header p {
            font-size: 0.9em;
            opacity: 0.8;
        }

        /* --- Landing View (Menu Buttons) --- */
        #landing-view {
            display: block; /* Default visible */
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
        }

        .menu-btn {
            padding: 25px;
            background: white;
            border: none;
            border-bottom: 2px solid #f0f0f0;
            color: var(--primary-color);
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .menu-btn:hover {
            background: #f0f5ff;
            color: #2a4a8b;
        }

        .menu-btn:last-child {
            border-bottom: none;
        }

        /* --- Content View (Grids and Filters) --- */
        #content-view {
            display: none; /* Hidden initially */
            padding: 20px;
            background: #f9f9f9;
            min-height: 500px;
        }

        .controls-area {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .back-btn {
            align-self: flex-start;
            padding: 8px 15px;
            background: #eee;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 10px;
            color: #555;
        }

        .search-input, .filter-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
        }
        
        .filter-select {
            display: none; /* Hidden by default, shown only for spells */
             background: white;
        }

        .section-title {
            color: var(--primary-color);
            margin-bottom: 15px;
            text-align: center;
        }

        /* --- Grid and Cards --- */
        .grid {
            display: grid;
            grid-template-columns: 1fr; /* Single column on mobile */
            gap: 15px;
        }
        
        @media (min-width: 768px) {
             .grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: var(--primary-color);
        }

        .card h3 {
            color: #2a4a8b;
            margin-bottom: 5px;
            font-size: 1.2em;
        }

        .card .subtitle {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 12px;
        }

        .card .property {
            margin: 5px 0;
            font-size: 0.9em;
            color: #555;
        }

        .card .property strong {
            color: var(--primary-color);
        }

        /* --- States & Modals --- */
        .loading-state, .error-state {
            text-align: center;
            padding: 40px;
            color: #666;
            display: none;
        }
        
        .error-state { color: #d9534f; }
        .error-icon { font-size: 3em; margin-bottom: 10px; display: block;}

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center; align-items: center;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%; max-width: 800px; max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .close {
            position: absolute; top: 15px; right: 20px;
            font-size: 2em; cursor: pointer; color: #999;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <span class="header-icon">🐉</span>
            <h1>D&D 5E 完整資料庫</h1>
            <p>繁體中文 | 種族、職業、法術完整資料</p>
        </div>

        <div id="global-loading" class="loading-state" style="display: block;">
            正在載入資料庫...
        </div>
        <div id="global-error" class="error-state">
            <span class="error-icon">❌</span>
            載入資料時發生錯誤<br>請檢查網絡或稍後再試
        </div>

        <div id="landing-view" style="display: none;">
            <div class="menu-buttons">
                <button class="menu-btn" onclick="navigateTo('races')">種族 Races</button>
                <button class="menu-btn" onclick="navigateTo('classes')">職業 Classes</button>
                <button class="menu-btn" onclick="navigateTo('spells')">法術 Spells</button>
            </div>
             <div style="min-height: 100px; background: #f8f9fa;"></div>
        </div>

        <div id="content-view">
            <button class="back-btn" onclick="showLanding()">← 返回選單</button>
            <h2 id="section-title" class="section-title"></h2>
            
            <div class="controls-area">
                <input type="text" id="searchInput" class="search-input" placeholder="搜尋名稱...">
                
                <select id="spellClassFilter" class="filter-select">
                    <option value="">所有職業的法術</option>
                    </select>
            </div>

            <div id="content-grid" class="grid"></div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // Data Storage
        let db = {
            classes: {},
            races: {},
            spells: {}
        };
        
        // State Management
        let currentSection = null; // 'classes', 'races', or 'spells'
        let spellClassesSet = new Set(); // To store unique classes found in spell data

        // --- Initialization ---
        async function loadData() {
            try {
                // Note: Assuming data files are in a 'data' folder relative to index.html
                const [classesRes, racesRes, spellsRes] = await Promise.all([
                    fetch('data/dnd5e_classes_complete_tc.json'),
                    fetch('data/dnd5e_races_complete_tc.json'),
                    fetch('data/dnd5e_spells_complete_tc.json')
                ]);

                if(!classesRes.ok || !racesRes.ok || !spellsRes.ok) throw new Error("Fetch failed");

                db.classes = await classesRes.json();
                db.races = await racesRes.json();
                db.spells = await spellsRes.json();

                // Pre-process spells to find all available classes for the filter
                extractSpellClasses();

                // Data loaded successfully
                document.getElementById('global-loading').style.display = 'none';
                document.getElementById('landing-view').style.display = 'block';

            } catch (error) {
                console.error('數據載入錯誤:', error);
                document.getElementById('global-loading').style.display = 'none';
                document.getElementById('global-error').style.display = 'block';
            }
        }

        // Helper to extract unique class names from spell data for the filter dropdown
        function extractSpellClasses() {
            spellClassesSet.clear();
            Object.values(db.spells).forEach(spell => {
                 // IMPORTANT: This assumes spell objects have a 'classes' array property.
                 // e.g., "classes": ["Wizard", "Sorcerer"]
                if (spell.classes && Array.isArray(spell.classes)) {
                    spell.classes.forEach(className => spellClassesSet.add(className));
                }
            });

            // Populate the select dropdown
            const filterSelect = document.getElementById('spellClassFilter');
            // keep first option
            filterSelect.innerHTML = '<option value="">所有職業的法術</option>'; 
            const sortedClasses = Array.from(spellClassesSet).sort();
            sortedClasses.forEach(className => {
                const option = document.createElement('option');
                option.value = className;
                option.textContent = className;
                filterSelect.appendChild(option);
            });
        }


        // --- Navigation ---
        function navigateTo(section) {
            currentSection = section;
            document.getElementById('landing-view').style.display = 'none';
            document.getElementById('content-view').style.display = 'block';
            
            // Reset filters
            document.getElementById('searchInput').value = '';
            document.getElementById('spellClassFilter').value = '';

            // Setup UI based on section
            const titleMap = { races: '種族 Races', classes: '職業 Classes', spells: '法術 Spells' };
            document.getElementById('section-title').textContent = titleMap[section];
            
            // Show/hide specific filters
            document.getElementById('spellClassFilter').style.display = (section === 'spells') ? 'block' : 'none';

            renderContent();
        }

        function showLanding() {
            currentSection = null;
            document.getElementById('content-view').style.display = 'none';
            document.getElementById('landing-view').style.display = 'block';
        }


        // --- Rendering Engine ---
        function renderContent() {
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedSpellClass = document.getElementById('spellClassFilter').value;

            let data Source = db[currentSection];
            if (!dataSource) return;

            Object.entries(dataSource).forEach(([key, item]) => {
                // 1. Name Search Filter (Applies to all)
                const fullName = (item.name + (item.name_en || '')).toLowerCase();
                if (!fullName.includes(searchTerm)) return;

                // 2. Spell-Specific Class Filter
                if (currentSection === 'spells' && selectedSpellClass) {
                     // If the spell doesn't have classes data, or doesn't include the selected class, skip it
                    if (!item.classes || !Array.isArray(item.classes) || !item.classes.includes(selectedSpellClass)) {
                        return;
                    }
                }

                // 3. Create and append card
                grid.appendChild(createCard(key, item));
            });
        }

        function createCard(key, item) {
            const card = document.createElement('div');
            card.className = 'card';
            
            let contentHtml = `
                <h3>${item.name || key}</h3>
                <div class="subtitle">${item.name_en || ''}</div>
            `;

            // Customize card content based on section type
            if (currentSection === 'classes') {
                contentHtml += `<div class="property"><strong>生命骰:</strong> ${item.hit_die || 'N/A'}</div>`;
                card.onclick = () => showClassDetail(item);
            } else if (currentSection === 'races') {
                 // Truncate long descriptions for the card view
                const shortDesc = item.description ? (item.description.substring(0, 60) + '...') : '無描述';
                 contentHtml += `<div class="property">${shortDesc}</div>`;
                card.onclick = () => showRaceDetail(item);
            } else if (currentSection === 'spells') {
                const levelStr = item.level && item.level !== "0" ? `${item.level}環` : '戲法';
                contentHtml = `
                    <h3>${item.name || key} <small style="font-size:0.8em">(${levelStr})</small></h3>
                    <div class="subtitle">${item.name_en || ''}</div>
                    <div class="property"><strong>學派:</strong> ${item.school || 'N/A'}</div>
                `;
                 // Optional: Show classes on the card itself
                 if(item.classes && item.classes.length > 0) {
                     contentHtml += `<div class="property" style="font-size:0.85em; color:#666;">${item.classes.join(', ')}</div>`
                 }
                card.onclick = () => showSpellDetail(item);
            }

            card.innerHTML = contentHtml;
            return card;
        }


        // --- Event Listeners for Inputs ---
        // Debounce search input slightly for performance
        let debounceTimer;
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(renderContent, 300);
        });

        document.getElementById('spellClassFilter').addEventListener('change', renderContent);


        // --- Modal Functions (Largely unchanged from original) ---
        function showClassDetail(cls) {
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <h2>${cls.name || ''}</h2> <h3>${cls.name_en || ''}</h3>
                <hr><br>
                <p><strong>生命骰:</strong> ${cls.hit_die || ''}</p>
                <p><strong>主要屬性:</strong> ${(cls.primary_ability || []).join(', ')}</p>
                <p><strong>豁免檢定:</strong> ${(cls.saving_throws || []).join(', ')}</p>
                <br><p class="desc"><strong>描述:</strong><br> ${cls.description || ''}</p>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function showRaceDetail(race) {
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <h2>${race.name || ''}</h2> <h3>${race.name_en || ''}</h3>
                 <hr><br>
                <p><strong>屬性值提升:</strong> ${JSON.stringify(race.ability_score_increase || {}).replace(/"/g, '').replace(/,/g, ', ')}</p>
                <p><strong>速度:</strong> ${race.speed || ''}</p>
                <br><p><strong>描述:</strong><br> ${race.description || ''}</p>
                <p><strong>年齡:</strong> ${race.age || ''}</p>
                <p><strong>體型:</strong> ${race.size || ''}</p>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function showSpellDetail(spell) {
            const modalBody = document.getElementById('modal-body');
            const levelStr = spell.level && spell.level !== "0" ? `${spell.level}環` : '戲法';
            modalBody.innerHTML = `
                <h2>${spell.name || ''} <small>(${levelStr})</small></h2>
                <h3>${spell.name_en || ''}</h3>
                 <hr><br>
                <p><strong>學派:</strong> ${spell.school || ''}</p>
                <p><strong>施法時間:</strong> ${spell.casting_time || ''}</p>
                <p><strong>射程:</strong> ${spell.range || ''}</p>
                <p><strong>成分:</strong> ${spell.components || ''}</p>
                <p><strong>持續時間:</strong> ${spell.duration || ''}</p>
                ${spell.classes ? `<p><strong>可用職業:</strong> ${spell.classes.join(', ')}</p>` : ''}
                <br><p class="desc"><strong>描述:</strong><br> ${spell.description || ''}</p>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Start application
        loadData();
    </script>
</body>
</html>
