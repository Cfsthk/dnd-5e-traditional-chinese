<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5E 完整資料庫 - 繁體中文</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 3px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            background: #e0e0e0;
        }

        .tab.active {
            background: white;
            border-bottom: 3px solid #667eea;
            color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-color: #667eea;
        }

        .card h3 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .card .subtitle {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .card .property {
            margin: 8px 0;
            padding: 8px;
            background: white;
            border-radius: 5px;
            font-size: 0.95em;
        }

        .card .property strong {
            color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            max-height: 80%;
            overflow-y: auto;
            position: relative;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2em;
            cursor: pointer;
            color: #999;
        }

        .close:hover {
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>D&D 5E 完整資料庫 - 繁體中文</h1>
            <p>完整的龍與地下城第五版資料庫</p>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('classes')">職業</div>
            <div class="tab" onclick="switchTab('races')">種族</div>
            <div class="tab" onclick="switchTab('spells')">法術</div>
        </div>
        <div class="content">
            <div id="classes" class="tab-content active">
                <div class="loading">載入中...</div>
                <div id="classes-grid" class="grid"></div>
            </div>
            <div id="races" class="tab-content">
                <div class="loading">載入中...</div>
                <div id="races-grid" class="grid"></div>
            </div>
            <div id="spells" class="tab-content">
                <div class="loading">載入中...</div>
                <div id="spells-grid" class="grid"></div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        let classesData = {};
        let racesData = {};
        let spellsData = {};

        // Load data and handle object structure
        async function loadData() {
            try {
                const [classesResponse, racesResponse, spellsResponse] = await Promise.all([
                    fetch('data/dnd5e_classes_complete_tc.json'),
                    fetch('data/dnd5e_races_complete_tc.json'),
                    fetch('data/dnd5e_spells_complete_tc.json')
                ]);

                classesData = await classesResponse.json();
                racesData = await racesResponse.json();
                spellsData = await spellsResponse.json();

                displayClasses();
            } catch (error) {
                console.error('數據載入錯誤:', error);
                document.querySelectorAll('.loading').forEach(el => {
                    el.textContent = '載入失敗，請重新整理頁面';
                });
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');

            if (tabName === 'classes') displayClasses();
            if (tabName === 'races') displayRaces();
            if (tabName === 'spells') displaySpells();
        }

        function displayClasses() {
            const grid = document.getElementById('classes-grid');
            const loading = document.querySelector('#classes .loading');
            
            if (loading) loading.style.display = 'none';
            grid.innerHTML = '';

            // Convert object to array
            Object.entries(classesData).forEach(([key, cls]) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showClassDetail(cls);
                card.innerHTML = `
                    <h3>${cls.name || key}</h3>
                    <div class="subtitle">${cls.name_en || ''}</div>
                    <div class="property"><strong>描述:</strong> ${cls.description || '無描述'}</div>
                    <div class="property"><strong>生命骰:</strong> ${cls.hit_die || 'N/A'}</div>
                `;
                grid.appendChild(card);
            });
        }

        function displayRaces() {
            const grid = document.getElementById('races-grid');
            const loading = document.querySelector('#races .loading');
            
            if (loading) loading.style.display = 'none';
            grid.innerHTML = '';

            // Convert object to array
            Object.entries(racesData).forEach(([key, race]) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showRaceDetail(race);
                card.innerHTML = `
                    <h3>${race.name || key}</h3>
                    <div class="subtitle">${race.name_en || ''}</div>
                    <div class="property"><strong>描述:</strong> ${race.description || '無描述'}</div>
                `;
                grid.appendChild(card);
            });
        }

        function displaySpells() {
            const grid = document.getElementById('spells-grid');
            const loading = document.querySelector('#spells .loading');
            
            if (loading) loading.style.display = 'none';
            grid.innerHTML = '';

            // Convert object to array
            Object.entries(spellsData).forEach(([key, spell]) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showSpellDetail(spell);
                card.innerHTML = `
                    <h3>${spell.name || key} ${spell.level ? '(' + spell.level + '環)' : ''}</h3>
                    <div class="subtitle">${spell.name_en || ''}</div>
                    <div class="property"><strong>學派:</strong> ${spell.school || 'N/A'}</div>
                    <div class="property"><strong>施法時間:</strong> ${spell.casting_time || 'N/A'}</div>
                `;
                grid.appendChild(card);
            });
        }

        function showClassDetail(cls) {
            const modal = document.getElementById('modal');
            const modalBody = document.getElementById('modal-body');
            
            modalBody.innerHTML = `
                <h2>${cls.name || ''}</h2>
                <h3>${cls.name_en || ''}</h3>
                <p><strong>描述:</strong> ${cls.description || ''}</p>
                <p><strong>生命骰:</strong> ${cls.hit_die || ''}</p>
                <p><strong>主要屬性:</strong> ${(cls.primary_ability || []).join(', ')}</p>
                <p><strong>豁免檢定:</strong> ${(cls.saving_throws || []).join(', ')}</p>
            `;
            
            modal.classList.add('active');
        }

        function showRaceDetail(race) {
            const modal = document.getElementById('modal');
            const modalBody = document.getElementById('modal-body');
            
            modalBody.innerHTML = `
                <h2>${race.name || ''}</h2>
                <h3>${race.name_en || ''}</h3>
                <p><strong>描述:</strong> ${race.description || ''}</p>
                <p><strong>屬性值提升:</strong> ${JSON.stringify(race.ability_score_increase || {})}</p>
                <p><strong>年齡:</strong> ${race.age || ''}</p>
                <p><strong>體型:</strong> ${race.size || ''}</p>
                <p><strong>速度:</strong> ${race.speed || ''}</p>
            `;
            
            modal.classList.add('active');
        }

        function showSpellDetail(spell) {
            const modal = document.getElementById('modal');
            const modalBody = document.getElementById('modal-body');
            
            modalBody.innerHTML = `
                <h2>${spell.name || ''}</h2>
                <h3>${spell.name_en || ''}</h3>
                <p><strong>環級:</strong> ${spell.level || ''}</p>
                <p><strong>學派:</strong> ${spell.school || ''}</p>
                <p><strong>施法時間:</strong> ${spell.casting_time || ''}</p>
                <p><strong>射程:</strong> ${spell.range || ''}</p>
                <p><strong>成分:</strong> ${spell.components || ''}</p>
                <p><strong>持續時間:</strong> ${spell.duration || ''}</p>
                <p><strong>描述:</strong> ${spell.description || ''}</p>
            `;
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
