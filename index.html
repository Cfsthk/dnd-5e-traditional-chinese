<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>D&D 5E 除錯模式</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #222; color: #eee; }
        .log { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .success { background: #1b5e20; }
        .error { background: #b71c1c; border: 1px solid #ff5252; }
        h1 { color: #fff; }
    </style>
</head>
<body>
    <h1>數據庫連線診斷 (Debug Mode)</h1>
    <div id="console"></div>

    <script>
        const logDiv = document.getElementById('console');
        function log(msg, type = 'neutral') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = msg;
            logDiv.appendChild(div);
        }

        async function checkFile(filename) {
            try {
                log(`正在嘗試讀取 <strong>${filename}</strong>...`);
                const res = await fetch(`data/${filename}`);
                
                if (!res.ok) {
                    throw new Error(`HTTP 錯誤: ${res.status} (找不到檔案?)`);
                }

                const text = await res.text();
                try {
                    JSON.parse(text);
                    log(`✅ ${filename} 格式正確！`, 'success');
                } catch (e) {
                    // 嘗試找出錯誤位置
                    const match = e.message.match(/position (\d+)/);
                    let locationInfo = '';
                    if (match) {
                        const pos = parseInt(match[1]);
                        const before = text.substring(Math.max(0, pos - 20), pos);
                        const after = text.substring(pos, Math.min(text.length, pos + 20));
                        locationInfo = `<br>錯誤位置附近的內容: "...${before} <strong style='color:yellow'>[這裡錯誤]</strong> ${after}..."`;
                    }
                    throw new Error(`JSON 格式錯誤 (SyntaxError): ${e.message} ${locationInfo}`);
                }
            } catch (err) {
                log(`❌ <strong>${filename}</strong> 失敗:<br>${err.message}`, 'error');
            }
        }

        async function runDiagnostics() {
            await checkFile('dnd5e_races_complete_tc.json');
            await checkFile('dnd5e_classes_complete_tc.json');
            await checkFile('dnd5e_spells_complete_tc.json');
        }

        runDiagnostics();
    </script>
</body>
</html>
